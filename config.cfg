; Vizor Space — настройки игры.
; Правьте блокнотом, затем перезапустите игру.
; Пустые строки и строки с `;` игнорируются.

; Язык интерфейса: en / ru / uk / es
lang = ru

; Сложность по умолчанию: easy / normal / hard
difficulty = normal

; Громкость звуков, 0..100
volume = 70

; Портативный режим: 1 = профиль и рекорды хранятся рядом с игрой
; (save.dat, highscores.dat в этой папке). 0 = хранить в системной
; папке приложения (%APPDATA%).
portable = 1